<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TA Global Initiative</title>
  <link rel="stylesheet" href="style.css" />
  <script src="lang.js" defer></script>
</head>

<body>

  <header>
    <nav>
      <div class="logo">
        <img src="logo.png" alt="TA Global Initiative Logo">
      </div>

      <ul class="main-menu">
        <li><a id="nav_about" href="#about"></a></li>
        <li><a id="nav_services" href="#services"></a></li>
        <li><a id="nav_gallery" href="#gallery"></a></li>
        <li><a id="nav_contact" href="#contact"></a></li>
      </ul>

      <ul class="language-toggle">
        <li><a onclick="changeLanguage('en')">English</a></li>
        <li><a onclick="changeLanguage('fr')">Français</a></li>
      </ul>
    </nav>

    <div class="hero">
      <div class="hero-content">
        <h1 id="hero_title"></h1>
        <p id="hero_subtitle"></p>
        <a href="#services" class="btn" id="hero_button"></a>
      </div>
    </div>
  </header>

  <section id="about">
    <h2 id="about_title"></h2>
    <h3 id="about_subtitle"></h3>
    <p id="about_text"></p>
    <a href="#contact" class="btn" id="about_button"></a>
  </section>

  <section id="services">
    <h2 id="services_title"></h2>
    <h3 id="services_subtitle"></h3>

    <div class="service">
      <h4 id="service1_title"></h4>
      <p id="service1_text"></p>
    </div>

    <div class="service">
      <h4 id="service2_title"></h4>
      <p id="service2_text"></p>
    </div>

    <div class="service">
      <h4 id="service3_title"></h4>
      <p id="service3_text"></p>
    </div>

    <a href="#contact" class="btn" id="services_button"></a>
  </section>

  <section id="gallery">
    <h2 id="gallery_title"></h2>
    <div class="gallery">
      <img src="work1.jpg" alt="Workers building road">
      <img src="work2.jpg" alt="Workers pouring concrete">
      <img src="work3.jpg" alt="Workers paving bricks">
    </div>
  </section>

  <section id="contact">
    <h2 id="contact_title"></h2>

    <form>
      <label id="form_name_label"></label>
      <input type="text" placeholder="Jane Smith" required />

      <label id="form_email_label"></label>
      <input type="email" placeholder="email@website.com" required />

      <label id="form_phone_label"></label>
      <input type="tel" placeholder="555-555-5555" required />

      <label id="form_message_label"></label>
      <textarea placeholder="" required></textarea>

      <label><input type="checkbox" required /> 
        <span id="form_checkbox_text"></span>
      </label>

      <button type="submit" id="form_button"></button>
    </form>

    <div class="contact-info">
      <h3 id="contact_info_title"></h3>
      <p><strong>Email:</strong> tresor@taglobalinitiative.com</p>
      <p><strong id="contact_location_label"></strong> 66/D Mpudi, Matete, Kinshasa 012, Democratic Republic of Congo</p>
      <p><strong id="contact_hours_label"></strong><br>
        <span id="contact_hours_text"></span>
      </p>
    </div>
  </section>

  <footer>
    <p id="footer_text"></p>
  </footer>

</body>
</html>
